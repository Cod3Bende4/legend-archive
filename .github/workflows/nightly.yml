name: Legend Archive

on:
  schedule:
    - cron: "30 16 * * *"      # 22:00 IST: list new uploads, AI check, rebuild, publish
  workflow_dispatch:            # "Run workflow" button (phone works too)
  push:
    branches: [main]
    paths: ["engine/**", ".github/workflows/**"]   # curation, code or workflow change: rebuild and publish only

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: legend-archive
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Kolkata
      SITE_DIR: _site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Refresh from YouTube (new uploads only)
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          if [ -z "$YT_API_KEY" ]; then echo "::error::Add the YT_API_KEY secret (Settings > Secrets and variables > Actions)"; exit 1; fi
          python engine/refresh.py --force

      - name: Rebuild page
        if: github.event_name == 'push' && !contains(github.event.head_commit.message, '[refresh]')
        run: python engine/refresh.py --rebuild

      - name: Save new data to the repo
        if: github.event_name != 'push' || contains(github.event.head_commit.message, '[refresh]')
        run: |
          git config user.name "legend-archive-bot"
          git config user.email "legend-archive-bot@users.noreply.github.com"
          git add engine/videos.json engine/scan
          if ! git diff --cached --quiet; then
            git commit -m "Nightly data $(date +%F)"
            git pull --rebase --autostash
            git push
          fi

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Separate job: the uploaded site is settled before publishing starts. GitHub's Pages API
  # sometimes misses a just-uploaded artifact, so one retry follows after a short wait.
  # (Re-running a failed run from the Actions page does not help: it finds two artifacts.)
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.retry.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
