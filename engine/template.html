*{box-sizing:border-box}
html{background:var(--ink);color:var(--fg);font-synthesis:none}body{color:var(--fg)}
body{font:16px/1.55 var(--body);margin:0}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--grain);opacity:var(--grain-o)}
a{color:var(--gold)}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.gut{padding-inline:clamp(16px,4vw,56px)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;flex-wrap:wrap;align-items:center;gap:14px 24px;padding-block:14px;background:var(--glass);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:linear-gradient(90deg,var(--gold) 0 64px,var(--ai) 64px 100%)}
.logo{display:inline-flex;align-items:center;gap:12px;font:400 25px/1 var(--display);letter-spacing:.01em;white-space:nowrap}.logo b{color:var(--gold);font-weight:400}
.hanko{display:grid;place-items:center;width:36px;height:36px;border-radius:5px;background:var(--gold);color:var(--gold-ink);font:400 21px/1 var(--display);box-shadow:inset 0 0 0 2px var(--gold),inset 0 0 0 3.5px var(--gold-ink);transform:rotate(-3deg)}
.origins{display:flex;gap:4px;padding:4px;border-radius:10px;background:var(--well);border:1px solid var(--line);flex:0 1 auto;overflow-x:auto;scrollbar-width:none}
.origins::-webkit-scrollbar{display:none}
.origin{display:inline-flex;align-items:baseline;gap:7px;min-height:38px;padding:9px 14px;border-radius:7px;text-decoration:none;color:var(--soft);font-weight:700;font-size:15px;white-space:nowrap}
.origin:hover{color:var(--fg);background:var(--hover)}
.origin[aria-current="page"]{background:var(--gold);color:var(--gold-ink)}
.origin small{font:600 11.5px var(--mono);opacity:.7}
.filters{padding-top:18px}
.pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-block:2px}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;white-space:nowrap}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 15px;border-radius:999px;border:1px solid var(--line2);background:transparent;font-weight:500;font-size:14px;cursor:pointer}
.pill:hover{background:var(--hover)}
.pill[aria-pressed="true"]{background:var(--fg);color:var(--ink);border-color:var(--fg)}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block}

const dot = (c) => `<i class="dot" style="background:${chCol(c)}"></i>`;
const chipsFor = (x) => x.chans.map(c => `<span class="chip">${dot(c)}${esc(chName(c))}</span>`).join('');
const PLAY = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M7 4.5v15l13-7.5z"/></svg>';
const CHEV = (d) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="${d < 0 ? 'M15 5l-7 7 7 7' : 'M9 5l7 7-7 7'}"/></svg>`;
const ALL = DATA.map((x,i) => ({x,i}));
const BYKEY = {}; ALL.forEach(o => BYKEY[o.x.key] = o);
const ofOrigin = (code) => ALL.filter(o => (o.x.origin || 'CN') === code);
const LIVE_ORIGINS = ORIGINS.filter(o => ofOrigin(o.code).length); // a section with no series gets no filter
const xorg = () => ORIGINS.find(o => o.id === S.xo); // undefined for "All"
const inView = () => xorg() ? ofOrigin(xorg().code) : ALL;
// Focus tabs: each keeps its own 15 slots
const QUEUES = [{id:'all', name:'Top 15'}, {id:'jp', code:'JP', name:'Top 15 Anime'}, {id:'cn', code:'CN', name:'Top 15 Donghua'}];
const inQueue = (x, q) => !q.code || (x.origin || 'CN') === q.code;

// Your progress lives in this browser, and in progress.json in the site's GitHub repo once cloud save is on:
// prog[key] = {i: furthest part opened, as an index into units(), t: when}, done / drop / saved[key] = date,
// focus[tab] = the keys holding that tab's 15 slots, so a slot only changes hands when you finish or drop a series,
// updated = last change (the newer copy wins when this browser and the cloud copy differ).
const EMPTY = () => ({prog:{}, done:{}, drop:{}, saved:{}, focus:{}, updated:0});
const P = (() => { try { return fix(Object.assign(EMPTY(), JSON.parse(localStorage.getItem(STORE)) || {})); } catch (_) { return EMPTY(); } })();
function fix(p) { if (Array.isArray(p.focus)) p.focus = {all: p.focus}; p.focus = p.focus || {}; p.saved = p.saved || {}; return p; } // older backups had one list
function keep() { try { localStorage.setItem(STORE, JSON.stringify(P)); } catch (_) {} }
function save() { P.updated = Date.now(); keep(); queuePush(); }
function replaceP(v) { Object.keys(P).forEach(k => delete P[k]); fix(Object.assign(P, EMPTY(), v)); keep(); }

// Cloud save: a fine-grained GitHub token (this repo only, Contents read and write), kept in this browser,
// commits progress.json to the repo. That file is outside engine/, so saving it does not rebuild the site.
const TOKEN = 'legend-archive:token';
const GH = (() => { const r = location.pathname.split('/')[1];
  return /\.github\.io$/.test(location.hostname) && r ? `https://api.github.com/repos/${location.hostname.split('.')[0]}/${r}/contents/progress.json` : null; })();
const CLOUD = {token: (() => { try { return localStorage.getItem(TOKEN) || ''; } catch (_) { return ''; } })(), sha: null, at: null, err: '', busy: false};
const b64 = (s) => btoa(unescape(encodeURIComponent(s)));
const unb64 = (s) => decodeURIComponent(escape(atob(s.replace(/\s/g, ''))));
const gh = (method, body) => fetch(GH + (method === 'GET' ? '?t=' + Date.now() : ''), {method, body: body && JSON.stringify(body),
  headers: {Authorization: 'Bearer ' + CLOUD.token, Accept: 'application/vnd.github+json'}});
async function pull() {
  if (!GH || !CLOUD.token || CLOUD.busy) return;
  CLOUD.busy = true;
  try {
    const r = await gh('GET');
    if (r.status === 404) { CLOUD.sha = null; CLOUD.busy = false; return push(); }
    if (!r.ok) throw new Error(r.status === 401 ? 'GitHub did not accept the token' : 'GitHub said ' + r.status);
    const j = await r.json(), v = JSON.parse(unb64(j.content));
    CLOUD.sha = j.sha; CLOUD.err = ''; CLOUD.at = new Date();
    // a browser with no edits of its own takes the cloud copy
    if (!P.updated || (v.updated || 0) > P.updated) { replaceP(v); renderMain(); if (S.sel !== null) renderSheet(); }
    else if ((v.updated || 0) < (P.updated || 0)) { CLOUD.busy = false; return push(); }
  } catch (e) { CLOUD.err = e.message; }
  CLOUD.busy = false; renderSync();
}
async function push() {
  if (!GH || !CLOUD.token || CLOUD.busy) return;
  CLOUD.busy = true;
  if (!P.updated) { P.updated = Date.now(); keep(); } // lists from before cloud save carried no timestamp
  try {
    const r = await gh('PUT', {message: 'Progress ' + today(), content: b64(JSON.stringify(P, null, 1)), ...(CLOUD.sha ? {sha: CLOUD.sha} : {})});
    if (r.status === 409 || r.status === 422) { CLOUD.busy = false; CLOUD.sha = null; return pull(); } // changed elsewhere: take the newer copy
    if (!r.ok) throw new Error(r.status === 401 ? 'GitHub did not accept the token' : r.status === 403 || r.status === 404 ? 'The token cannot write to this repo' : 'GitHub said ' + r.status);
    CLOUD.sha = (await r.json()).content.sha; CLOUD.err = ''; CLOUD.at = new Date();
  } catch (e) { CLOUD.err = e.message; }
  CLOUD.busy = false; renderSync();
}
let pushTimer;
function queuePush() { if (GH && CLOUD.token) { clearTimeout(pushTimer); pushTimer = setTimeout(push, 3000); } }
function syncText() {
  if (!GH) return 'Cloud save works on the published site only.';
  if (!CLOUD.token) return 'Saved in this browser only. Turn on cloud save so clearing the browser or switching devices loses nothing.';
  if (CLOUD.err) return 'Cloud save problem: ' + CLOUD.err + '. Your list is still saved in this browser.';
  return CLOUD.at ? 'Cloud save on. Last synced ' + CLOUD.at.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) + '.' : 'Cloud save on. Syncing…';
}
function renderSync() { const el = $('sync'); if (el) el.textContent = syncText(); }

// every playable upload of a series in watch order: each episode, or the season's one upload when it has no episode list
const UNITS = {};
function units(i) {
  if (!UNITS[i]) {
    const x = DATA[i], many = x.seas.length > 1;
    UNITS[i] = x.seas.flatMap((s, si) => (s.eps && s.eps.length ? s.eps : [{n: many ? 'Full' : 'Feature', id: s.pick.id, dur: s.pick.dur}])
      .map(e => ({si, id: e.id, n: (many ? s.short + ' ' : '') + e.n, dur: secs(e.dur)})));
  }
  return UNITS[i];
}
function status(o) {
  const u = units(o.i), p = P.prog[o.x.key], at = p ? Math.min(p.i, u.length - 1) : -1;
  const tot = u.reduce((n, e) => n + e.dur, 0) || 1, seen = u.slice(0, at + 1).reduce((n, e) => n + e.dur, 0);
  return {at, next: u[at + 1] || null, nextI: at + 1, pct: Math.round(100 * seen / tot), left: tot - seen, n: u.length};
}
// opening a part moves your place forward (never back); opening the last part finishes the series unless
// that part is over an hour long (a full-season upload), which you finish with "Mark finished"
function reach(i, u, exact) {
  const k = DATA[i].key, p = P.prog[k], last = units(i).length - 1;
  if (exact || !p || u > p.i) P.prog[k] = {i: u, t: Date.now()}; else p.t = Date.now();
  if (!exact && u === last && units(i)[last].dur <= 3600) P.done[k] = today();

}
const gone = (k) => !!(P.done[k] || P.drop[k]);
// a series and its English-dub upload are one story: they share a slot, and finishing or dropping either settles both
const twin = (k) => k.endsWith('-dub') ? k.slice(0, -4) : k + '-dub';
const settled = (k) => gone(k) || gone(twin(k));
const fits = (x) => x.completed && x.score != null && x.audio !== 'A3' && x.q !== 'ai'; // may hold a slot
const byScore = (a, b) => (b.x.score ?? -1) - (a.x.score ?? -1) || b.x.total - a.x.total;
const byRecent = (a, b) => ((P.prog[b.x.key] || {}).t || 0) - ((P.prog[a.x.key] || {}).t || 0);
function focusList(id) {
  const q = QUEUES.find(t => t.id === (id || S.fq)) || QUEUES[0], had = P.focus[q.id] || [];
  const ok = (k) => BYKEY[k] && !settled(k) && inQueue(BYKEY[k].x, q);
  let f = had.filter(k => ok(k) && (fits(BYKEY[k].x) || P.prog[k]));
  f = f.filter((k, j) => { const t = f.indexOf(twin(k)), a = !!P.prog[k], b = !!P.prog[twin(k)]; return t < 0 || a > b || (a === b && j < t); });
  // a series you have started always gets a slot: its twin's if that holds one, else the lowest-scored one you have not started
  Object.keys(P.prog).filter(k => ok(k) && fits(BYKEY[k].x) && f.indexOf(k) < 0)
    .sort((a, b) => P.prog[b].t - P.prog[a].t).forEach(k => {
      const tw = f.indexOf(twin(k));
      if (tw >= 0) { if (!P.prog[twin(k)]) f[tw] = k; return; }
      const fresh = f.filter(j => !P.prog[j]);
      if (f.length >= FOCUS && fresh.length) f.splice(f.indexOf(fresh.reduce((a, b) => BYKEY[a].x.score <= BYKEY[b].x.score ? a : b)), 1);
      f.push(k);
    });
  ALL.filter(o => fits(o.x) && !settled(o.x.key) && inQueue(o.x, q)).sort(byScore).forEach(o => {
    if (f.length < FOCUS && f.indexOf(o.x.key) < 0 && f.indexOf(twin(o.x.key)) < 0) f.push(o.x.key);
  });
  if (f.join('\n') !== had.join('\n')) { P.focus[q.id] = f; keep(); } // refilled slots are not your edits: no timestamp, no cloud push
  return f.map(k => BYKEY[k]).sort((a, b) => byRecent(a, b) || byScore(a, b));
}

function frame(x, opts) {
  const id = x.seas[0].pick.id, big = opts && opts.big;
  const img = `<img alt="" loading="lazy" src="${thumb(id, big ? 'maxresdefault' : 'hqdefault')}" onload="imgOk(this)" onerror="imgBad(this,'${id}',${big?1:0})">`;
  return `<div class="frame"><div class="art" style="${art(x)}"></div>${img}<div class="shade"></div>${opts && opts.inner || ''}</div>`;
}
function imgOk(el) {
  if (el.naturalWidth <= 120) return imgBad(el); // YouTube's grey placeholder for missing sizes
  el.parentNode.classList.add('has-img');
  if (!LIVE) { LIVE = true; if (S.sel !== null) renderSheet(); }
}
function imgBad(el, id, big) {
  if (big && id && !el.dataset.retry) { el.dataset.retry = 1; el.src = thumb(id, 'hqdefault'); return; }
  el.remove();
}
function matches(x) {
  if (!S.q) return true;
  const hay = (x.title + ' ' + x.tag + ' ' + (x.summary || '') + ' ' + x.seas.map(s => s.pick.t + ' ' + s.alts.map(a => a.t).join(' ')).join(' ')).toLowerCase();
  return hay.indexOf(S.q) >= 0;
}
function renderNav() {
  const n = focusList().length;

  $('origins').innerHTML = `<a class="origin" href="#/${S.fq === 'all' ? '' : 'focus/' + S.fq}"${S.mode === 'focus' ? ' aria-current="page"' : ''}>Focus<small>${n}</small></a>

    <a class="origin" href="#/explore${S.xo === 'all' ? '' : '/' + S.xo}"${S.mode === 'explore' ? ' aria-current="page"' : ''}>Explore<small>${ALL.length}</small></a>`;
}
function chansHere() {
  const n = {};
  inView().forEach(o => o.x.chans.forEach(c => n[c] = (n[c] || 0) + 1));
  return Object.keys(n).sort((a,b) => n[b] - n[a]);
}
function renderPills() {

    `<button class="pill" type="button" data-fq="${t.id}" aria-pressed="${S.fq === t.id}">${t.name}</button>`).join(''); return; }

function renderStats() {

    [here.length,'series'],[up,`uploads across ${nch} channel${nch === 1 ? '' : 's'}`],[here.filter(x=>x.seasons>1).length,'multi-season stories'],
    [here.filter(x=>x.rating).length,'rated 7.5+'],[Math.round(here.reduce((n,x)=>n+x.total,0)/3600)+'h','of watch time']

function tile(x, i, st) {
  const k = x.key, mark = P.done[k] ? '<span class="badge new">WATCHED</span>' : P.drop[k] ? '<span class="badge">DROPPED</span>' : '';
  const inner = `<div class="tag"><span class="genre" style="color:${x.ac}">${esc(x.genre)}</span><span style="display:flex;gap:6px">${mark}${x.fresh ? '<span class="badge new">NEW</span>' : ''}${x.q === 'ai' ? '<span class="badge" title="AI-made, flagged from comments">AI</span>' : ''}<span class="badge">${badge(x)}</span></span></div><div class="ptitle" style="font-size:${Math.round(x.fs*0.6)}px">${esc(x.title)}</div>`
    + (st && st.at >= 0 ? `<div class="prog"><i style="width:${st.pct}%"></i></div>` : '');
  const where = !st ? x.totalF : st.at < 0 ? 'Start · ' + x.totalF : st.next ? `Next ${esc(st.next.n)} · ${hm(st.left)} left` : 'Last part opened';

}
const grid = (list, withStatus) => `<div class="grid">${list.map(o => tile(o.x, o.i, withStatus || P.prog[o.x.key] ? status(o) : null)).join('')}</div>`;
const block = (title, sub, list) => `<section aria-label="${esc(title)}"><div class="shelf-head"><h2>${esc(title)}</h2><span>${esc(sub)}</span></div><div style="margin-top:14px">${grid(list)}</div></section>`;
function renderFocus() {
  const q = QUEUES.find(t => t.id === S.fq);

function renderList() {

const SORTS = {quality:['Best first', byScore], rating:['Rating', (a,b) => (b.x.rating||0) - (a.x.rating||0) || b.x.total - a.x.total],

function renderPlace(x, i) {

    <div class="go">${gone(k) ? '<button class="btn gold sm" type="button" data-restore>Bring it back</button>' : `

// the selected episode: play it here or on YouTube; while it plays here, step to the previous or next one
function renderPick(x, i) {

  const yt1 = (cls, text) => `<a class="btn ${cls}" href="${yt(cur.id)}" target="_blank" rel="noopener" data-u="${u}">${text}</a>`;
  const info = `<div style="min-width:0"><div class="lab"><span>${S.here ? 'Playing' : 'Selected'}</span>${dot(ep.ch)}<span class="who">${esc(chName(ep.ch))}</span><span>${hm(cur.dur)}</span></div>

    <div class="steps">
      <button class="btn ghost sm" type="button" data-step="-1"${prev ? '' : ' disabled'}>◀ ${prev ? 'Previous: ' + esc(prev.n) : 'Previous'}</button>
      <button class="btn gold sm" type="button" data-step="1"${next ? '' : ' disabled'}>${next ? 'Next: ' + esc(next.n) : 'Last episode'} ▶</button>
      ${yt1('ghost sm', 'Open on YouTube')}
    </div>
    <p class="hint muted">Black screen or "unavailable"? That channel blocks playing outside YouTube: use Open on YouTube.</p></div>`;
}
function renderSheet() {
  const v = $('veil');
  if (S.sel === null) { v.hidden = true; v.innerHTML = ''; document.body.style.overflow = ''; return; }
  const x = DATA[S.sel], si = Math.min(S.season, x.seas.length - 1), s = x.seas[si];
  const one = x.seas.length === 1;
  const base = units(S.sel).findIndex(u => u.si === si), at = status({x, i:S.sel}).at;
  v.innerHTML = `<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(x.title)}">
    <button class="round close" type="button" data-close aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    <div class="sheet-top" style="background:radial-gradient(80% 140% at 0% 0%,${x.c1}40,transparent 65%)">
      ${frame(x, {big:true, inner:`<div class="tag"><span class="genre" style="color:${x.ac}">${esc(x.genre)}</span></div><div class="ptitle" style="font-size:26px">${esc(x.title)}</div>`})}
      <div class="sheet-copy">
        <div class="eyebrow" style="--ac:${x.ac}"><span>${badge(x)}</span><i>/</i><span>${x.totalF} total</span></div>
        <h2>${esc(x.title)}</h2>
        ${x.tag ? `<p>${esc(x.tag)}</p>` : ''}
        ${renderPlace(x, S.sel)}
        ${x.summary ? `<div class="summary"><b>Summary</b><p>${esc(x.summary)}</p></div>`
          : x.summaryStatus === 'unavailable' ? `<div class="summary nosum"><b>Summary</b><p>No reliable description found for this series yet. It will be added if a source turns up.</p></div>`
          : `<div class="summary nosum"><b>Summary</b><p>Description not written yet.</p></div>`}
        ${x.facts ? `<div class="facts">${esc(x.facts)}</div>` : ''}
        <div class="chips">${chipsFor(x)}</div>
        ${(x.watch || []).length ? `<div class="summary"><b>Also watch on</b><p>${x.watch.map(w => `<a href="${esc(w.url)}" target="_blank" rel="noopener">${esc(w.site)}</a>`).join(' · ')}</p></div>` : ''}
        ${x.note ? `<div class="note"><b>${esc(x.conf || 'note')}</b><span>${esc(x.note)}</span></div>` : ''}
        ${x.missing.length ? `<div class="gapnote">Season ${x.missing.join(', ')} ${x.missing.length > 1 ? 'are' : 'is'} not uploaded on these channels yet.</div>` : ''}
      </div>
    </div>
    <div class="sheet-body">
      <div class="tabs" role="tablist" aria-label="Seasons">${x.seas.map((t,j) => `<button type="button" role="tab" data-season="${j}" aria-selected="${j===si}">${one ? (t.eps && t.eps.length > 1 ? 'Episodes' : 'Full feature') : esc(t.label)}${t.pick.new || t.alts.some(a => a.new) ? ' · new' : ''}</button>`).join('')}</div>
      ${renderPick(x, S.sel)}
      ${s.eps && s.eps.length > 1 ? `<div class="alts"><h3>${s.eps.length} episodes · tap one to choose how to play it</h3><div class="eps">${s.eps.map((e, j) => `<button type="button" class="ep ${base + j === S.u ? 'on' : ''} ${base + j <= at ? 'seen' : ''}" data-pick="${base + j}">${e.n}<em>${e.dur}</em></button>`).join('')}</div></div>` : ''}
      ${s.alts.length ? `<div class="alts"><h3>Also uploaded as</h3>${s.alts.map(a => `<a class="alt" href="${yt(a.id)}" target="_blank" rel="noopener"><span class="c">${dot(a.ch)}${esc(chName(a.ch))}</span><span>${esc(a.t)}</span><span class="d">${a.dur}</span></a>`).join('')}</div>` : ''}
    </div></div>`;
  v.hidden = false; document.body.style.overflow = 'hidden';
}
function renderMain() {
  renderNav(); renderPills(); renderStats();
  if (S.q) renderSearch(); else if (S.mode === 'focus') renderFocus(); else if (S.mode === 'list') renderList(); else renderExplore();
  renderLegend();
}
function renderLegend() {
  $('legend').innerHTML = chansHere().map(c => `<span class="chip">${dot(c)}${esc(chName(c))}</span>`).join('');
}
function route() {
  // #/ and #/focus/jp|cn are Focus tabs; #/list is My List; #/explore and #/explore/cn|jp|kr is Explore (older #/cn links land in Explore too)
  const h = location.hash, mode = /^#\/list/.test(h) ? 'list' : /^#\/(explore|cn|jp|kr)/.test(h) ? 'explore' : 'focus';
  const m = /^#\/(?:explore\/|focus\/)?(cn|jp|kr)/.exec(h), id = m ? m[1] : 'all';
  const xo = mode === 'explore' ? (LIVE_ORIGINS.some(o => o.id === id) ? id : 'all') : S.xo;
  const fq = mode === 'focus' ? (QUEUES.some(t => t.id === id) ? id : 'all') : S.fq;
  const moved = mode !== S.mode || xo !== S.xo || fq !== S.fq;
  if (moved) S.shown = PAGE;
  S.mode = mode; S.xo = xo; S.fq = fq;
  renderMain();
  if (moved) window.scrollTo(0, 0);
}
function openSheet(i) {
  const st = status(ALL[i]);
  S.sel = i; S.u = st.next ? st.nextI : 0; S.season = units(i)[S.u].si; S.here = false; S.place = false; renderSheet();
}
function closeSheet() { S.sel = null; S.here = false; S.place = false; renderSheet(); }
function cloudToggle() {
  if (CLOUD.token) {
    if (!confirm('Turn off cloud save in this browser? Your list stays here and in the repo.')) return;
    CLOUD.token = ''; try { localStorage.removeItem(TOKEN); } catch (_) {}
    return renderMain();
  }
  const t = (prompt('Paste a GitHub fine-grained token for this repo with Contents: Read and write.\nIt is kept in this browser only.') || '').trim();
  if (!t) return;
  CLOUD.token = t; CLOUD.err = ''; CLOUD.at = null; try { localStorage.setItem(TOKEN, t); } catch (_) {}
  renderMain(); pull();
}
function backup() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(P)], {type:'application/json'}));
  a.download = 'legend-archive-progress-' + today() + '.json';
  a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

document.addEventListener('click', (e) => {
  const u = e.target.closest('[data-u]');
  if (u && S.sel !== null) {
    if (S.place) { e.preventDefault(); reach(S.sel, +u.dataset.u, true); S.place = false; renderSheet(); renderMain(); return; }
    reach(S.sel, +u.dataset.u);
    setTimeout(() => { renderSheet(); renderMain(); }); // after the link has opened
  }
  const t = e.target.closest('[data-open],[data-fq],[data-xo],[data-close],[data-season],[data-pick],[data-here],[data-step],[data-sort],[data-more],[data-open-all],[data-seen],[data-place],[data-finish],[data-drop],[data-restore],[data-backup],[data-save],[data-cloud]');
  if (!t) { if (e.target === $('veil')) closeSheet(); return; }
  const k = S.sel !== null ? DATA[S.sel].key : null;
  if (t.dataset.open !== undefined) openSheet(+t.dataset.open);
  else if (t.dataset.fq) location.hash = '#/' + (t.dataset.fq === 'all' ? '' : 'focus/' + t.dataset.fq);
  else if (t.dataset.xo) location.hash = '#/explore' + (t.dataset.xo === 'all' ? '' : '/' + t.dataset.xo);
  else if (t.dataset.close !== undefined) closeSheet();
  else if (t.dataset.season) {
    S.season = +t.dataset.season;
    if (units(S.sel)[S.u].si !== S.season) { S.u = units(S.sel).findIndex(u => u.si === S.season); S.here = false; }
    renderSheet();
  }
  else if (t.dataset.pick !== undefined) {
    const u = +t.dataset.pick;
    if (S.place) { reach(S.sel, u, true); S.place = false; renderSheet(); renderMain(); return; }
    S.u = u; S.season = units(S.sel)[u].si;
    if (S.here) reach(S.sel, u);  // already watching here: switch straight to it
    renderSheet(); if (S.here) renderMain();
    const pk = $('pick'); if (pk) pk.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  }
  else if (t.dataset.here !== undefined) { S.here = true; reach(S.sel, S.u); renderSheet(); renderMain(); }
  else if (t.dataset.step) {
    const us = units(S.sel), u = S.u + +t.dataset.step;
    if (u < 0 || u >= us.length) return;
    S.u = u; S.season = us[u].si; reach(S.sel, u); renderSheet(); renderMain();
  }
  else if (t.dataset.sort) { S.sort = t.dataset.sort; S.shown = PAGE; renderMain(); }
  else if (t.dataset.seen !== undefined) { S.hideSeen = !S.hideSeen; renderMain(); }
  else if (t.dataset.more !== undefined) { S.shown += PAGE; renderMain(); }
  else if (t.dataset.openAll) { S.open[t.dataset.openAll] = true; renderMain(); }
  else if (t.dataset.backup !== undefined) backup();
  else if (t.dataset.cloud !== undefined) cloudToggle();
  else if (k && t.dataset.save !== undefined) { if (P.saved[k]) delete P.saved[k]; else P.saved[k] = today(); save(); renderSheet(); renderMain(); }
  else if (t.dataset.place !== undefined) { S.place = !S.place; renderSheet(); }
  else if (k && (t.dataset.finish !== undefined || t.dataset.drop !== undefined || t.dataset.restore !== undefined)) {
    if (t.dataset.finish !== undefined) P.done[k] = today();
    else if (t.dataset.drop !== undefined) P.drop[k] = today();
    else { delete P.done[k]; delete P.drop[k]; }
    save(); S.place = false; renderSheet(); renderMain();
  }
});
document.addEventListener('change', (e) => {
  if (e.target.id !== 'restore' || !e.target.files[0]) return;
  e.target.files[0].text().then(t => {
    const v = JSON.parse(t);
    if (!v || typeof v.prog !== 'object') throw new Error('not a backup');
    replaceP(v); save(); renderMain();
  }).catch(() => alert('That file is not a Legend Archive progress backup.'));
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && S.sel !== null) closeSheet(); });
$('q').addEventListener('input', (e) => { S.q = e.target.value.trim().toLowerCase(); S.open = {}; renderMain(); });
$('foot').textContent = 'Updated ' + new Date(META.updated).toLocaleString([], {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'}) + (META.added ? ' · ' + META.added + ' new upload' + (META.added > 1 ? 's' : '') : '') + (META.hidden ? ' · ' + META.hidden + ' AI-slop series hidden' : '') + (META.failed.length ? ' · could not reach ' + META.failed.join(', ') : '') + '. Refreshes daily at 10 PM.';
window.addEventListener('hashchange', route);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') pull(); }); // back from YouTube or another device
route();
pull();
</script>
